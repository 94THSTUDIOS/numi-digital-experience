<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Numi — A warm, intuitive math learning experience for children with dyscalculia. Show your fingers to the camera and learn to count!" />
    <title>Numi — Play</title>

    <!--
    ════════════════════════════════════════════════════════════
    play.html  —  THE GAME PAGE
    ════════════════════════════════════════════════════════════

    CHANGE FROM ORIGINAL:
    The original project had a single index.html that contained
    both the landing/hero area AND the camera player. This caused
    layout problems (player got clipped, scrollbar appeared) and
    loaded heavy AI libraries even on the landing page.

    We split it into two pages:
      • index.html  → lightweight landing page (no game scripts)
      • play.html   → full-screen game experience (all scripts here)

    This page intentionally has very little HTML structure.
    The visual UI (instructions, numbers, celebration screens) is
    injected by each level's JavaScript as a DOM overlay on top of
    the p5.js canvas. Nothing is hardcoded here except the shell.
    ════════════════════════════════════════════════════════════
    -->

    <!-- style.css is shared between index.html and play.html.
         The play-page-* CSS classes inside it override the
         default layout to make the player full-width/full-height. -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page-wrapper">

        <!-- ── NAVBAR ─────────────────────────────────────── -->
        <!-- Same navbar component as index.html.
             "Play" link gets the --active modifier so it appears highlighted. -->
        <nav class="navbar" id="navbar">
            <div class="navbar__brand">
                <!-- Clicking the logo goes back to the landing page -->
                <a href="index.html" style="text-decoration: none; display: flex; align-items: baseline;">
                    <span class="navbar__logo"><span>N</span>umi</span>
                </a>
                <span class="navbar__tagline">Digital Math Experience</span>
            </div>
            <ul class="navbar__nav">
                <li><a href="play.html" class="navbar__link navbar__link--active">Play</a></li>
                <li><a href="index.html" class="navbar__link">Home</a></li>
            </ul>
        </nav>

        <!-- ── MAIN CONTENT ───────────────────────────────── -->
        <!-- play-page-main overrides the default flex layout so the
             player fills the remaining vertical space without scrolling. -->
        <main class="main-content play-page-main" id="main-content">

            <!-- #player-container / #player-frame are the mounting points.
                 sketch.js appends the <canvas> element inside #player-frame.
                 Each level (level0, level1, level2) also appends its own
                 <div> overlay inside #player-frame, floating above the canvas
                 via position:absolute. -->
            <div class="player-container play-page-container" id="player-container">
                <div class="player-frame play-page-frame" id="player-frame">

                    <!-- ── CONFETTI ─────────────────────────────────── -->
                    <!--
                    CHANGE FROM ORIGINAL:
                    Originally this was a <dotlottie-wc> web component that
                    loaded a Lottie animation from an external URL. We went
                    through several iterations:
                      1. Remote .lottie URL  → pixelated when stretched
                      2. Local .lottie file  → required the dotlottie-wc library
                      3. Remote .json URL    → dependency on external server
                      4. Local .gif          → works natively, no extra library

                    The element ID "confetti-lottie" is kept the same so that
                    state.js's showConfetti() / hideConfetti() helpers continue
                    to work without any code changes — they just toggle
                    el.style.display between 'block' and 'none'.

                    The GIF is hidden by default (display:none) and is shown
                    only during the celebration phase of each step/round.
                    It sits centered over the full player frame using
                    position:absolute + transform:translate(-50%,-50%).
                    -->
                    <img id="confetti-lottie" src="images/confetti v2.gif"
                        style="display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width: 100%; height: 100%; pointer-events:none; z-index:20;"
                        alt="Confetti" />

                    <!-- The p5 <canvas> and each level's overlay <div> are
                         injected here at runtime by sketch.js / level*.js -->
                </div>
            </div>
        </main>

    </div>

    <!-- ══════════════════════════════════════════════════════
         SCRIPT LOAD ORDER — THIS ORDER IS CRITICAL
         ══════════════════════════════════════════════════════
         Dependencies must always be loaded before the files that
         use them. The rule is: consumers come after producers.

         1. p5.js       — creates global p5 functions (createCanvas, draw, etc.)
         2. ml5.js      — creates global ml5 object (ml5.handPose, etc.)
         3. state.js    — creates global `gameState` object
         4. level0.js   — creates global `level0` object  (needs gameState)
         5. level1.js   — creates global `level1` object  (needs gameState)
         6. level2.js   — creates global `level2` object  (needs gameState)
         7. sketch.js   — starts the p5 sketch (needs EVERYTHING above)
                          sketch.js calls gameState.register() and
                          gameState.transitionTo() in its setup() function,
                          so all level objects must already exist by then.

         CHANGE FROM ORIGINAL:
         The original single-page version had no explicit load order
         concern because all logic lived in one sketch.js. Now that
         the code is split across multiple files, this order is the
         "wiring" that connects them all together.
    ════════════════════════════════════════════════════════ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.js"></script>
    <script src="state.js"></script>
    <script src="levels/level0.js"></script>
    <script src="levels/level1.js"></script>
    <script src="levels/level2.js"></script>
    <script src="sketch.js"></script>
</body>

</html>
