<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Numi — A warm, intuitive math learning experience for children with dyscalculia. Show your fingers to the camera and learn to count!" />
    <title>Numi — Digital Math Experience</title>

    <!--
    ════════════════════════════════════════════════════════════
    index.html  —  THE LANDING PAGE
    ════════════════════════════════════════════════════════════

    CHANGE FROM ORIGINAL:
    The original project had a single index.html that mixed the
    landing/marketing content with the full game player (including
    p5.js canvas, ml5 AI model, and all game scripts).

    Problems with that approach:
      • The AI model (MediaPipe HandPose) downloads ~5 MB of WASM
        on every page load, even if the user never plays.
      • The camera player was crammed into a small box inside the
        page layout, and clipped on smaller screens.
      • It was hard to separate "marketing" content from game logic.

    New approach — two separate pages:
      • index.html  (this file) — pure marketing/landing page.
                                  NO game scripts at all.
                                  Loads fast, looks clean.
      • play.html               — the full game experience.
                                  Loads all the heavy scripts.
                                  Player spans the full screen.

    The only connection between the two pages is the "Play Now"
    button, which is a normal <a href="play.html"> link.
    ════════════════════════════════════════════════════════════
    -->

    <!--
    NOTE: The original index.html also had the dotlottie-wc script
    loaded here. It has since been removed — the confetti is now a
    plain <img> GIF in play.html, so no special library is needed.
    -->

    <!-- style.css is shared with play.html -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="page-wrapper">

        <!-- ── NAVBAR ─────────────────────────────────────── -->
        <!-- Shared navigation bar. On the landing page "Play" links
             to play.html. "About" and "Help" are placeholders. -->
        <nav class="navbar" id="navbar">
            <div class="navbar__brand">
                <!-- The "N" is wrapped in a <span> so it can be styled
                     differently (e.g. different color) via CSS -->
                <span class="navbar__logo"><span>N</span>umi</span>
                <span class="navbar__tagline">Digital Math Experience</span>
            </div>
            <ul class="navbar__nav">
                <li><a href="play.html" class="navbar__link">Play</a></li>
                <li><a href="#" class="navbar__link">About</a></li>
                <li><a href="#" class="navbar__link">Help</a></li>
            </ul>
        </nav>

        <!-- ── MAIN CONTENT ───────────────────────────────── -->
        <!-- This uses the default .main-content layout (not play-page-main).
             Content is centered and vertically stacked. -->
        <main class="main-content" id="main-content">

            <!-- Hero: the primary marketing copy and CTA button.
                 The h1 uses a <span> so "hands" can be styled differently
                 in CSS (gradient, highlight, etc.). -->
            <div class="hero-text">
                <h1>Count with your <span>hands</span></h1>
                <p>Hold up 1–5 fingers in front of your camera and Numi will recognise them. A fun, accessible way to
                    build number confidence.</p>

                <!-- ── PLAY NOW BUTTON ─────────────────────────── -->
                <!-- This is the only link between the landing page and the game.
                     Clicking it navigates to play.html where all the AI and
                     camera scripts are loaded. No JavaScript needed. -->
                <div style="margin-top: 2rem;">
                    <a href="play.html" class="btn btn--primary"
                        style="font-size: 1.25rem; padding: 1rem 2.5rem; border-radius: 99px;">Play Now</a>
                </div>
            </div>
        </main>

        <!-- ── FOOTER ─────────────────────────────────────── -->
        <!-- Simple credits footer. Lists the libraries used. -->
        <footer class="footer" id="footer">
            <div class="footer__credits">Built with care by <span>Numi</span></div>
            <div class="footer__tech caption-2">p5.js · ml5.js · MediaPipe</div>
        </footer>

    </div>

    <!--
    ════════════════════════════════════════════════════════════
    INTENTIONALLY NO SCRIPTS HERE
    ════════════════════════════════════════════════════════════
    CHANGE FROM ORIGINAL:
    The original index.html loaded p5.js, ml5.js, and all the
    game logic scripts here. That meant every visitor to the
    landing page would download ~5 MB of AI code even if they
    never clicked "Play Now."

    Now: zero scripts on this page. Fast load, clean separation.
    All heavy scripts live only in play.html.
    ════════════════════════════════════════════════════════════
    -->
</body>

</html>
